{% load static %}

<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <meta name="theme-color" content="#07111f" />

        <title>{% block title %} AIR OPS {% endblock title %}</title>

        <link
            rel="stylesheet"
            crossorigin
            href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css"
        />

        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        />

        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        />

        <link rel="stylesheet" href="{% static 'css/tokens.css' %}" />

        <link rel="stylesheet" href="{% static 'css/app_dialog.css' %}" />

        <link
            rel="stylesheet"
            href="{% static 'css/ios_theme.css' %}?v=20260831-6"
        />

        {% block css %} {% endblock css %}

        <link
            rel="stylesheet"
            href="{% static 'css/mobile.css' %}?v=20260905-1"
        />
    </head>

    <body>
        {% block content %} {% endblock content %} 
        {% include "manhour/partials/app_dialog.html" %}

        <script src="{% static 'js/app_dialog.js' %}"></script>
    </body>
</html>
