<article class="manning-v2-area-card{% if area.manning_set.count == 0 %} manning-mobile-empty-content{% endif %}">
    <header class="manning-v2-area-card-header">
        <h4 class="manning-v2-area-name">{{ area.name }}</h4>
        <span class="manning-v2-area-count">{{ area.manning_set.count }}명</span>
    </header>

    <div class="manning-v2-worker-grid">
        {% for manning in area.manning_set.all %}
        <span class="manning-v2-worker-name" title="{{ manning.worker_name }}">
            {{ manning.worker_name }}
        </span>

        {% empty %}
        <div class="manning-v2-area-empty">
            배정된 작업자가 없습니다.
        </div>
        {% endfor %}
    </div>
</article>
